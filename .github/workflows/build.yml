# Сборка keypress на трёх платформах.
#
# - пуш в main / PR → fmt + тесты (ubuntu) + релизные сборки
#   windows / linux / macos; артефакты доступны в разделе Actions запуска;
# - пуш тега v* (например v0.5.1) → GitHub Release с этими же архивами.
#
# GUI работает только под Windows; бинарники Linux/macOS — заглушки
# (чистые модули конфига/клавиш собираются везде, это проверка переносимости).

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release создаёт релизы по тегам

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Формат
        run: cargo fmt --check
      - name: Тесты
        run: cargo test

  build:
    name: build (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false # упавшая платформа не отменяет остальные
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: keypress-windows
            archive: keypress-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: keypress-linux
            archive: keypress-linux.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: keypress-macos
            archive: keypress-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Сборка
        run: cargo build --release --target ${{ matrix.target }}
      - name: Упаковка (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/keypress.exe -DestinationPath ${{ matrix.archive }}
      - name: Упаковка (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release keypress
      - name: Артефакт запуска
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
      - name: GitHub Release (пуш тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
