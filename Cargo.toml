[package]
name = "keypress"
version = "0.5.1"
edition = "2021"

# Чистые модули (config/fx/keys/input) кроссплатформенные — cargo test
# выполняется прямо на Linux. GUI/хуки собираются только под Windows.
# build.rs вшивает UIAccess-манифест только при KEYPRESS_UIACCESS=1
# (обычная сборка не меняется).
[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
eframe = "0.28"
egui_extras = { version = "0.28", features = ["svg"] }
# Кастомные кейкапы-картинки: декод PNG/JPG/etc своими руками (без
# ImageLoader-магии), RGBA -> ColorImage -> текстура egui
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
] }
crossbeam-channel = "0.5"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
] }

[profile.release]
strip = true
lto = "thin"
