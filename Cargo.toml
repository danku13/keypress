[package]
name = "keyviz-lite"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
strip = true
lto = "thin"
