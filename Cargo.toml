[package]
name = "keypress"
version = "0.1.0"
edition = "2021"

# Чистые модули (config/fx/keys/input) кроссплатформенные — cargo test
# выполняется прямо на Linux. GUI/хуки собираются только под Windows.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
eframe = "0.28"
crossbeam-channel = "0.5"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
] }

[profile.release]
strip = true
lto = "thin"
